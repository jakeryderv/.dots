name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate dotfiles repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck lua5.4 shfmt
      - name: Run portable checks
        env:
          REQUIRE_LINTERS: "1"
        run: bash _helpers/check-repo.sh
