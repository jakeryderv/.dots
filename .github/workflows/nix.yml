name: Nix toolchain

on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/nix.yml
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - nix/**
      - .github/workflows/nix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build user toolchain (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Check flake evaluation
        run: nix flake check --no-build --no-update-lock-file
      # Evaluation alone cannot catch build failures or file collisions in
      # buildEnv. Build the same bundle that a new machine installs.
      - name: Build the complete toolchain
        run: nix build .#default --no-link --no-update-lock-file
