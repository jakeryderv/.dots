# ============================================
# Basic Settings
# ============================================

# Set prefix key to Alt-a
unbind C-b
set-option -g prefix M-a
bind -N "Send prefix through to nested tmux" M-a send-prefix

unbind -n C-\\

# Explicit inner TERM
set -g default-terminal "tmux-256color"

# Escape timeout 0 to fix delayed insert to normal in neovim
set -g escape-time 0

# When the last pane of a session closes, switch to next session instead of detaching
set -g detach-on-destroy off

# vi keys in the tmux command prompt
set -g status-keys vi

# Resize the current window only to the attached client size (not the whole session)
set -g aggressive-resize on

# Mouse support
set -g mouse on
# Smooth 1-line scroll
bind -N "Scroll copy mode up one line" -T copy-mode-vi WheelUpPane   send-keys -X -N 1 scroll-up
bind -N "Scroll copy mode down one line" -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# System clipboard integration via OSC 52 (wezterm supports it)
set -g set-clipboard on

# Vi mode in copy mode
setw -g mode-keys vi

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when one is closed
set -g renumber-windows on

# larger history scrollback
set -g history-limit 50000

# let processes/shells auto-rename windows
set -g allow-rename on

# recomended from pi-coding-agent
set -g extended-keys on
set -g extended-keys-format csi-u

# ============================================
# Display & Colors
# ============================================

# True color + rich terminal features (hyperlinks, styled underlines)
# NOTE: sixel intentionally dropped — of our terminals only wezterm supports it,
# and it shares TERM=xterm-256color with kitty (which doesn't), so it can't be
# cleanly targeted by TERM. wezterm still renders images via the kitty/iTerm2
# protocols (which ride allow-passthrough below, not this flag).
set-option -sa terminal-features ',*:RGB:hyperlinks:strikethrough:usstyle:extkeys'

# Allow programs to pass through escape sequences (for image protocols like kitty/iTerm2)
set -g allow-passthrough all
set -ga update-environment 'TERM_PROGRAM'

# Focus events (allows nvim autoread to work)
set-option -g focus-events on

# pane borders
set -g pane-border-style fg='#535353'
set -g pane-active-border-style fg='#78a9ff',bold

# show pane border status (displays pane info in border)
set -g pane-border-status top
set -g pane-border-format "#[fg=#78a9ff,bold] #{pane_index} #{pane_current_command} "

# message style
set -g message-style fg='#f2f4f8',bg='#161616',bold

# activity monitoring
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style fg='#f9a826',bg='#161616'

# ============================================
# status bar
# ============================================

# position & update frequency
set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# status bar colors
set -g status-style bg='#161616',fg='#f2f4f8'

# length limits
set -g status-left-length 60
set -g status-right-length 100

# Left side: session name, optional sync badge, and persistent interaction mode
set -g status-left '#[fg=#78a9ff,bold][#S] #{?pane_synchronized,#[fg=#161616#,bg=#fa4d56#,bold] SYNC #[default] ,}#{?#{==:#{client_key_table},resize-mode},#[fg=#161616#,bg=#42be65#,bold] RESIZE #[default],#{?client_prefix,#[fg=#161616#,bg=#f9a826#,bold] PREFIX #[default],#{?#{==:#{pane_mode},copy-mode},#[fg=#161616#,bg=#be95ff#,bold] COPY #[default],#{?pane_in_mode,#[fg=#161616#,bg=#78a9ff#,bold] MODE #[default],#[fg=#a2a9b0#,bg=#262626] NORMAL #[default]}}}} '

# Right side: window/pane count, date, time (icons + muted labels, bright values, | separators)
set -g status-right '#[fg=#535353]| #[fg=#78a9ff,bold] #[fg=#f2f4f8,nobold]#{session_windows} #[fg=#535353]| #[fg=#f9a826,bold] #[fg=#f2f4f8,nobold]#{window_panes} #[fg=#535353]| #[fg=#6e6f70]%Y-%m-%d #[fg=#535353]| #[fg=#f2f4f8,bold]%H:%M '

# window status format
set -g window-status-format ' #I:#W#F '
set -g window-status-current-format ' #I:#W#F '
set -g window-status-current-style fg='#161616',bg='#78a9ff',bold
set -g window-status-style fg='#6e6f70',bg='#161616'
set -g window-status-separator ' '

# ============================================
# Keybindings - General
# ============================================

# Reload tmux config
bind -N "Reload tmux configuration" R source-file ~/.tmux.conf \; display-message "<Config reloaded!>"

# Generated from the live key tables, so defaults, overrides, and plugins stay current.
bind -N "Open generated keybinding cheatsheet" ? display-popup -E -w 90% -h 90% \
  -b rounded -T " #[fg=#78a9ff,bold]tmux keybindings " \
  "~/.local/bin/tmux-cheatsheet | fzf --ansi --no-sort --layout=reverse \
    --info=inline --header-lines=4 --header-lines-border=bottom --cycle \
    --prompt='filter> ' --pointer='▶' \
    --color='bg:#161616,bg+:#262626,fg:#f2f4f8,fg+:#f2f4f8,hl:#78a9ff,hl+:#78a9ff,info:#a2a9b0,prompt:#f9a826,pointer:#78a9ff,border:#535353,header:#a2a9b0' \
    --bind='enter:ignore,ctrl-u:clear-query' >/dev/null"

# split panes (keep current path)
bind -N "Split pane horizontally in current path" | split-window -h -c "#{pane_current_path}"
bind -N "Split pane vertically in current path" - split-window -v -c "#{pane_current_path}"

# new window in current path
bind -N "Create window in current path" c new-window -c "#{pane_current_path}"

# kill without confirmation
bind -N "Kill current pane" x kill-pane
bind -N "Kill current window" X kill-window

# tmux-sessionizer
bind-key -N "Open project sessionizer" -r f display-popup -E -w 70% -h 60% -x C -y C \
  -b rounded -T " #[fg=#78a9ff,bold]projects " \
  "~/.local/bin/tmux-sessionizer"

# enter copy mode with v
bind -N "Enter copy mode" v copy-mode

# quick session switching
bind -N "Choose session in native tree" s choose-tree -sZ
bind -N "Switch sessions with fzf" S display-popup -E -w 70% -h 60% -x C -y C \
  -b rounded -T " #[fg=#78a9ff,bold]sessions " \
  "tmux list-sessions -F '#{session_name}' | fzf --print0 | xargs -0 -r tmux switch-client -t"


# new session
bind -N "Create a new session" N new-session

# toggle pane synchronization
bind -N "Toggle synchronized panes" a setw synchronize-panes \; display "Sync: #{?synchronize-panes,ON,OFF}"

# ============================================
# Keybindings - window & pane nav
# ============================================



# ============================================
# Keybindings - Resize Mode
# ============================================

# Enter resize mode with prefix + R
bind -N "Enter sticky resize mode" r switch-client -T resize-mode

# In resize mode, use vim keys and STAY in resize mode with -repeat
bind -N "Resize pane left by 5" -T resize-mode h resize-pane -L 5 \; switch-client -T resize-mode
bind -N "Resize pane down by 5" -T resize-mode j resize-pane -D 5 \; switch-client -T resize-mode
bind -N "Resize pane up by 5" -T resize-mode k resize-pane -U 5 \; switch-client -T resize-mode
bind -N "Resize pane right by 5" -T resize-mode l resize-pane -R 5 \; switch-client -T resize-mode

# Bigger jumps with Shift - also stay in resize mode
bind -N "Resize pane left by 10" -T resize-mode H resize-pane -L 10 \; switch-client -T resize-mode
bind -N "Resize pane down by 10" -T resize-mode J resize-pane -D 10 \; switch-client -T resize-mode
bind -N "Resize pane up by 10" -T resize-mode K resize-pane -U 10 \; switch-client -T resize-mode
bind -N "Resize pane right by 10" -T resize-mode L resize-pane -R 10 \; switch-client -T resize-mode


# Exit resize mode with Escape or Enter
bind -N "Exit resize mode" -T resize-mode Escape switch-client -T root
bind -N "Exit resize mode" -T resize-mode Enter switch-client -T root
bind -N "Exit resize mode" -T resize-mode q switch-client -T root

# ============================================
# vim-tmux-navigator
# ============================================
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -N "Navigate left across tmux and Vim" -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -N "Navigate down across tmux and Vim" -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -N "Navigate up across tmux and Vim" -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -N "Navigate right across tmux and Vim" -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -N "Navigate to previously active pane" -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'"  'select-pane -l'

bind-key -N "Select pane to the left" -T copy-mode-vi 'C-h' select-pane -L
bind-key -N "Select pane below" -T copy-mode-vi 'C-j' select-pane -D
bind-key -N "Select pane above" -T copy-mode-vi 'C-k' select-pane -U
bind-key -N "Select pane to the right" -T copy-mode-vi 'C-l' select-pane -R
bind-key -N "Select previously active pane" -T copy-mode-vi 'C-\' select-pane -l

# Keep mouse selection highlighted after drag release
bind -N "Keep mouse selection highlighted" -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Copy selection to tmux buffer and system clipboard via OSC 52
bind -N "Copy selection and exit copy mode" -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================================
# Plugins (TPM)
# ============================================
# Install TPM first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then reload tmux and press: prefix + I (capital i) to install plugins.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'laktak/extrakto'

# Persistent popup terminal: prefix + t toggles a scratch tmux session.
set -g @floax-bind 't'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'
set -g @floax-session-name 'scratch'
set -g @floax-title 'terminal'
set -g @floax-border-color '#78a9ff'
set -g @floax-text-color '#78a9ff'

# Match tmux-fzf to the session and project picker popup dimensions.
set-environment -g TMUX_FZF_OPTIONS '-p -w 70% -h 60% -m'

# Auto-save every 15 minutes, but DON'T auto-restore on server start (manual restore only)
# Restore manually with: prefix + Ctrl+r
# Save manually with:    prefix + Ctrl+s
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
