# ============================================
# Basic Settings
# ============================================

# Set prefix key to Alt-a
unbind C-b
set-option -g prefix M-a
bind M-a send-prefix

unbind -n C-\\

# Explicit inner TERM
set -g default-terminal "tmux-256color"

# Escape timeout 0 to fix delayed insert to normal in neovim
set -g escape-time 0

# When the last pane of a session closes, switch to next session instead of detaching
set -g detach-on-destroy off

# vi keys in the tmux command prompt
set -g status-keys vi

# Resize the current window only to the attached client size (not the whole session)
set -g aggressive-resize on

# Mouse support
set -g mouse on

# System clipboard integration via OSC 52 (wezterm supports it)
set -g set-clipboard on

# Vi mode in copy mode
setw -g mode-keys vi

# start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when one is closed
set -g renumber-windows on

# larger history scrollback
set -g history-limit 50000

# let processes/shells auto-rename windows
set -g allow-rename on

# recomended from pi-coding-agent
set -g extended-keys on
set -g extended-keys-format csi-u

# ============================================
# Display & Colors
# ============================================

# True color + rich terminal features (hyperlinks, styled underlines, sixel)
set-option -sa terminal-features ',*:RGB:hyperlinks:strikethrough:usstyle:sixel:extkeys'

# Allow programs to pass through escape sequences (for image protocols like kitty/iTerm2)
set -g allow-passthrough all
set -ga update-environment 'TERM_PROGRAM'

# Focus events (allows nvim autoread to work)
set-option -g focus-events on

# pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=blue,bold

# show pane border status (displays pane info in border)
set -g pane-border-status top
set -g pane-border-format "#[fg=blue,bold] #{pane_index} #{pane_current_command} "

# message style
set -g message-style fg=white,bg=black,bold

# activity monitoring
setw -g monitor-activity on
set -g visual-activity off
set -g window-status-activity-style fg=yellow,bg=black

# ============================================
# status bar
# ============================================

# position & update frequency
set -g status-position bottom
set -g status-interval 1
set -g status-justify left

# status bar colors
set -g status-style bg=black,fg=white

# length limits
set -g status-left-length 40
set -g status-right-length 100

# Left side: session name, sync/prefix indicators
set -g status-left '#[fg=blue,bold][#S]#{?pane_synchronized,#[fg=red] SYNC,}#{?client_prefix,#[reverse] <PREFIX>,} '

# Right side: window/pane count, date, time (icons + muted labels, bright values, | separators)
set -g status-right '#[fg=#535353]| #[fg=#78a9ff,bold] #[fg=#f2f4f8,nobold]#{session_windows} #[fg=#535353]| #[fg=#f9a826,bold] #[fg=#f2f4f8,nobold]#{window_panes} #[fg=#535353]| #[fg=#6e6f70]%Y-%m-%d #[fg=#535353]| #[fg=#f2f4f8,bold]%H:%M '

# window status format
set -g window-status-format ' #I:#W#F '
set -g window-status-current-format ' #I:#W#F '
set -g window-status-current-style fg=black,bg=blue,bold
set -g window-status-style fg=white,bg=black
set -g window-status-separator ' '

# ============================================
# Keybindings - General
# ============================================

# Reload tmux config
bind R source-file ~/.tmux.conf \; display-message "<Config reloaded!>"

# split panes (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# new window in current path
bind c new-window -c "#{pane_current_path}"

# kill without confirmation
bind x kill-pane
bind X kill-window

# tmux-sessionizer
bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# enter copy mode with v
bind v copy-mode

# quick session switching
bind s choose-session
bind S display-popup -E -w 60% -h 60% -x C -y C \
  -b rounded -T " #[fg=blue,bold]sessions " \
  "tmux list-sessions -F '#{session_name}' | fzf | xargs -r tmux switch-client -t"


# new session
bind N new-session

# toggle pane synchronization
bind a setw synchronize-panes \; display "Sync: #{?synchronize-panes,ON,OFF}"

# ============================================
# Keybindings - window & pane nav
# ============================================



# ============================================
# Keybindings - Resize Mode
# ============================================

# Enter resize mode with prefix + R
bind r switch-client -T resize-mode

# In resize mode, use vim keys and STAY in resize mode with -repeat
bind -T resize-mode h resize-pane -L 5 \; switch-client -T resize-mode
bind -T resize-mode j resize-pane -D 5 \; switch-client -T resize-mode
bind -T resize-mode k resize-pane -U 5 \; switch-client -T resize-mode
bind -T resize-mode l resize-pane -R 5 \; switch-client -T resize-mode

# Bigger jumps with Shift - also stay in resize mode
bind -T resize-mode H resize-pane -L 10 \; switch-client -T resize-mode
bind -T resize-mode J resize-pane -D 10 \; switch-client -T resize-mode
bind -T resize-mode K resize-pane -U 10 \; switch-client -T resize-mode
bind -T resize-mode L resize-pane -R 10 \; switch-client -T resize-mode


# Exit resize mode with Escape or Enter
bind -T resize-mode Escape switch-client -T root
bind -T resize-mode Enter switch-client -T root
bind -T resize-mode q switch-client -T root

# ============================================
# vim-tmux-navigator
# ============================================
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" "send-keys 'C-\\'"  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Keep mouse selection highlighted after drag release
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# ============================================
# Plugins (TPM)
# ============================================
# Install TPM first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then reload tmux and press: prefix + I (capital i) to install plugins.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'

# Auto-save every 15 minutes, but DON'T auto-restore on server start (manual restore only)
# Restore manually with: prefix + Ctrl+r
# Save manually with:    prefix + Ctrl+s
set -g @continuum-restore 'off'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
