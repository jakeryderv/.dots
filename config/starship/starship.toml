"$schema" = 'https://starship.rs/config-schema.json'

# Two lines. Line one is every piece of information: where, git, the active
# environment, and -- right-aligned by $fill -- what just happened.
# Line two is the prompt symbol alone, so the input never
# shares its line with anything.
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$fill\
$status\
$cmd_duration\
$line_break\
$character"""

[fill]
symbol = " "

# Colours are ANSI names, so the terminal theme (carbonfox in all four) sets
# the real values, and each kind of information gets its own: where is blue,
# git is purple with pink for dirty, a venv stays grey
# (the glyph is enough), and outcomes are red (exit code) and yellow (duration).
[directory]
style = "bold blue"

# The exit code of the last command, only when non-zero. The red ❯ already
# says something failed; this says what, which matters for 130 vs 1 vs 127.
[status]
disabled = false
format = "[$status]($style) "
style = "bold red"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$symbol$branch]($style)"
symbol = " "
style = "purple"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](#ff7eb6) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"
# The default threshold; short commands do not earn a number.
min_time = 2000

[python]
format = "[$symbol$virtualenv]($style) "
symbol = " "
style = "bright-black"
detect_extensions = []
detect_files = []
