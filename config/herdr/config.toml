# herdr - terminal workspace manager for AI coding agents.
# Full annotated defaults: `herdr --default-config`. Only keys that differ from
# upstream live here, so future default changes are inherited rather than pinned.
# Validate after editing with `herdr config check` -- it rejects unknown keys,
# unparseable bindings, and out-of-range enum values.
#
# Key namespaces already spoken for on this machine (see docs/herdr.md):
#   Alt+a           shared tmux/Herdr prefix (separate Ghostty tabs)
#   Ctrl+h/j/k/l    Vim-aware navigation in both multiplexers
#   Ctrl+Alt+*      released by Ghostty for inner applications
#   Alt+`           tmux floating terminal
# Ctrl+b stays available to readline.

onboarding = false

# ============================================
# Theme
# ============================================

[theme]
# Inherit the host terminal palette instead of a built-in. Ghostty already
# renders carbonfox (config/ghostty/carbonfox.ghostty), so the palette is
# defined once and herdr borrows it -- including over SSH, where the remote
# herdr picks up whatever the local terminal is using.
name = "terminal"

[theme.custom]
# Inherit Ghostty's solid background in panes. "reset" emits no
# background color at all rather than painting one over it.
panel_bg = "reset"

# carbonfox blue -- the same accent tmux uses for the active pane border and
# the current window in the status bar.
accent = "#78a9ff"

# Muted gray for inactive pane borders and labels. This shared theme token also
# colors other secondary UI elements.
overlay0 = "#525252"

# ============================================
# Keys
# ============================================

[keys]
# Same prefix as tmux, on purpose. The two run in separate Ghostty tabs and
# never nest, so there is no chord to contend over -- and with the keymaps
# already matched, the prefix was the last thing standing between one set of
# muscle memory and two.
#
# It also stops herdr undoing a trade tmux.conf already made. `unbind C-b` gave
# Ctrl+b back to readline (it is backward-char); herdr's default prefix was
# quietly taking it again in every agent pane. Readline does not bind M-a.
#
# herdr's docs rank alt+... below ctrl+letter for reliability, but that caveat
# is about terminal and tmux setups. Here Ghostty talks to herdr directly, and
# Ghostty demonstrably delivers alt+a -- tmux has been eating it in the next tab
# all along.
prefix = "alt+a"

# --- Splits ------------------------------------------------------------------
# herdr names splits after the divider's orientation, not tmux's flags:
#   split_vertical   = vertical divider   = panes side by side
#                                           (`pane split --direction right`)
#   split_horizontal = horizontal divider = panes stacked (`--direction down`)
# tmux's `-h` means the opposite, so ignore the word and match the glyph. Both
# glyphs are now exactly tmux's: `|` beside, `-` stacked.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# --- Tab / workspace / pane movement ----------------------------------------
# hjkl follows the layout: the tab bar runs horizontally, so h/l steps tabs;
# the sidebar stacks workspaces vertically, so k/j steps workspaces. tmux.conf
# binds the same letters to windows and sessions.
#
# That takes prefix+hjkl from herdr's default pane focus, which moves to the
# arrows -- tmux's own default for select-pane. Everyday pane movement is
# Ctrl+hjkl (vim-herdr-navigation, below); the arrows are the fallback for
# passthrough TUIs or a missing Vim bridge. Setting a key replaces the default,
# so n/p (herdr's and tmux's tab keys) are listed alongside.
previous_tab = ["prefix+h", "prefix+p"]
next_tab = ["prefix+l", "prefix+n"]
previous_workspace = "prefix+k"
next_workspace = "prefix+j"
switch_workspace = "prefix+shift+1..9"
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"
# herdr's swap_pane_* actions (missing from `herdr --default-config`) default to
# prefix+shift+hjkl, which the tab/workspace moves above now own. Unbind them so
# each chord has one meaning; pane swapping lives in move mode (prefix+m).
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""

# --- Agents ------------------------------------------------------------------
# Jump between agent panes without going through the sidebar. Unbound upstream,
# and the reason this tool exists. `a` is free because herdr has no
# synchronize-panes for it to mean what it means in tmux.
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"

# Indexed agent focus -- herdr's own documented example, and unreachable until
# config.ghostty released alt+1..9 (it bound them twice, logically and
# physically, and consumed them before any inner layer saw them). tmux does not
# bind alt+digits at root, so the chord now passes Ghostty -> tmux -> herdr.
# Binding alt+1..9 in tmux would take it back; don't.
focus_agent = "prefix+alt+1..9"

# --- Tabs --------------------------------------------------------------------
# Shift+h/l moves the tab the way h/l steps between them (tmux.conf: swap-window).
# Shift+k/j moves the workspace: see the herdr-move-workspace commands below.
move_tab_previous = ["prefix+shift+h", "prefix+shift+left"]
move_tab_next = ["prefix+shift+l", "prefix+shift+right"]

# --- tmux parity -------------------------------------------------------------
# herdr and tmux run side by side in two Ghostty tabs, so every verb they share
# should be the same key in both. These four were the only gaps left worth
# closing; see docs/herdr.md for the three that deliberately stay different.
#
#   ,  rename    tmux binds `,` to rename-window; herdr's default was shift+t
#   d  detach    tmux binds `d`;                   herdr's default was q
#   ;  last pane tmux binds `;`;                   unbound upstream
rename_tab = "prefix+comma"
detach = "prefix+d"
last_pane = "prefix+;"

# --- Resize ------------------------------------------------------------------
# Direct resize without entering resize mode, in the space config.ghostty gave
# up (it used these exact chords for resize_split). prefix+r still opens the
# sticky resize mode, which is the tmux-shaped path.
resize_pane_left = "ctrl+shift+alt+left"
resize_pane_down = "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"

# --- Popups ------------------------------------------------------------------
# A floating terminal on the prefix, the way tmux binds Alt+` to toggle-popup.
# 80%x80% matches the tmux popup dimensions. `popup` is session-modal and leaves
# the tab layout alone; it closes when the command exits.
#
# Named, unlike the panes: `terminal.default_shell` is left empty so panes
# inherit $SHELL, but a popup runs a command rather than a shell, and there is
# no $SHELL placeholder to give it. Keep in step with `chsh` (docs/zsh.md).
[[keys.command]]
key = "prefix+backtick"
type = "popup"
command = "zsh"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

# --- Move mode ---------------------------------------------------------------
# prefix+m, then hjkl/arrows swaps the focused pane with its neighbour until
# Esc/Enter/q -- the counterpart of resize mode (prefix+r), and of tmux.conf's
# move-mode table. herdr has no user-defined key tables, so the "mode" is a
# small popup running config/scripts/herdr-move-mode, which calls pane.swap.
[[keys.command]]
key = "prefix+m"
type = "popup"
command = "herdr-move-mode"
width = 46
height = 4
description = "move mode: swap panes with hjkl"

# --- Workspace reorder -------------------------------------------------------
# herdr 0.8.2 has no keybinding action for this, only the socket API's
# workspace.move (what sidebar dragging uses). config/scripts/herdr-move-workspace
# calls it; `shell` runs it detached with no pane or popup.
[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "herdr-move-workspace up"
description = "move workspace up"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "herdr-move-workspace down"
description = "move workspace down"

# --- Plugins -----------------------------------------------------------------
# Install the pinned plugins first; see docs/herdr.md. The navigation bridge
# needs its Neovim half too, loaded by lua/plugins/vim-tmux-navigator.lua.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Keep the built-in prefix+g picker as a fallback.
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr.picker.open"
description = "open picker with previews"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "gh-pr.open-pr"
description = "open branch PR in browser"

[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "gh-pr.refresh"
description = "refresh PR status"

# ============================================
# UI
# ============================================

[ui]
# Identify agent panes at a glance. Manual pane names still take precedence.
show_agent_labels_on_pane_borders = true

# Attention queue rather than sidebar order: with desktop notifications on, the
# agent that needs input should be the one at the top. Use "spaces" to group by
# workspace instead.
agent_panel_sort = "priority"

# Distinct glyphs per state (blocked/working/done/idle/unknown) instead of
# colored dots. The terminal font is a Nerd Font, and state is worth reading
# without decoding hue.
status_indicators = "symbols"

# tmux creates windows immediately (`bind c new-window`) and lets processes
# rename them. Do the same rather than prompting for a name first.
prompt_new_tab_name = false

# tmux.conf kills panes and windows without confirmation. Match it.
confirm_close = false

# tmux overrides the wheel to a smooth 1-line scroll; Ghostty's discrete:3
# applies to the outer terminal, not to the panes herdr draws itself.
mouse_scroll_lines = 1

# Hide the tab row, including its right-side status, when there is only one tab.
hide_tab_bar_when_single_tab = true

# The tmux status-right analogue. tmux carries window count, pane count, date,
# and time; herdr has no count entries, so this is the zoom badge plus the same
# date and clock. Separator matches the dim `|` tmux draws between fields.
tab_bar_right_separator = " │ "
tab_bar_right = [
    { type = "zoom" },
    { type = "datetime", format = "%Y-%m-%d" },
    { type = "datetime", format = "%H:%M" },
]

# Left at defaults, noted because tmux configures the equivalent explicitly:
#   mouse_capture = true   herdr handles clicks, so Ghostty's ctrl+click URL
#                          opening and tmux's C-MouseDown1Pane hyperlink bind do
#                          not reach a pane. Set false to hand clicks back to
#                          the terminal, or set right_click_passthrough_modifier
#                          to forward just right-drag to pane apps.
#   copy_on_select = true  matches copy-mode-vi MouseDragEnd1Pane copying on
#                          drag release.

# Use the same two-row layout for every agent. gh-pr supplies the optional $pr
# metadata token; it is empty for branches without a PR. Emphasize workspace
# names and dim agent names without changing state icons or PR metadata.
[ui.sidebar.agents]
rows = [
    ["state_icon", { token = "workspace", bold = true }, "tab"],
    [{ token = "agent", dim = true }, "$pr"],
]

[ui.toast]
# Desktop notification when a background agent finishes or blocks. A deliberate
# exception to the no-bells policy in config.ghostty (bell-features =
# no-system,no-audio,no-attention,...): a bell is the terminal being noisy, this
# is an agent asking for input.
delivery = "system"
delay_seconds = 1

# ============================================
# Behavior
# ============================================

[experimental]
# Forward Kitty graphics from pane applications to compatible outer terminals
# so Pi and tools such as Yazi can render inline images through Herdr.
kitty_graphics = true

# Keep pane scrollback across a full server restart. Agent transcripts are the
# reason to scroll back at all, and re-running the agent does not reproduce them.
pane_history = true
