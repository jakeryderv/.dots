# Carbonfox palette from config/nvim/lua/colors.lua and Vim's UI shades.
# Leaf's syntax setting selects a bundled Syntect theme, not a .tmTheme file.
base = "ocean"
syntax = "base16-ocean.dark"

[ui]
content_bg = "#161616"
toc_bg = "#1c1c1c"
toc_border = "#535353"
scrollbar_hover = "#78a9ff"
status_bg = "#161616"
status_separator = "#535353"
status_brand_fg = "#161616"
status_brand_bg = "#78a9ff"
status_filename_fg = "#f2f4f8"
status_filename_bg = "#252525"
status_watch_fg = "#25be6a"
status_watch_bg = "#1c1c1c"
status_reloaded_fg = "#161616"
status_reloaded_bg = "#25be6a"
status_search_fg = "#be95ff"
status_search_bg = "#252525"
status_success_fg = "#25be6a"
status_success_bg = "#1c1c1c"
status_warning_fg = "#f9a826"
status_error_fg = "#fa4d56"
status_error_bg = "#1c1c1c"
status_shortcut_fg = "#b6b8bb"
status_percent_fg = "#78a9ff"
toc_hover_fg = "#f2f4f8"
toc_header_fg = "#b6b8bb"
toc_active_bg = "#2a2a2a"
toc_inactive_bg = "#1c1c1c"
toc_accent = "#78a9ff"
toc_index_inactive = "#6e6f70"
toc_primary_active = "#f2f4f8"
toc_primary_inactive = "#b6b8bb"
toc_secondary_inactive = "#6e6f70"
toc_secondary_text_active = "#f2f4f8"
toc_secondary_text_inactive = "#b6b8bb"

[markdown]
text = "#f2f4f8"
strong_text = "#f2f4f8"
